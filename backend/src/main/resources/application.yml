server:
  port: 8080

spring:
  application:
    name: ikea-ordering-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ikea_ordering?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug

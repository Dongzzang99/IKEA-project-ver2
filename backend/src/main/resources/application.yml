server:
  port: 8080

spring:
  application:
    name: ikea-ordering-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ikea_ordering?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET:portfolio-ikea-ordering-system-jwt-secret-key-2026}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

toss:
  payments:
    secret-key: ${TOSS_SECRET_KEY:test_sk_replace_me}
    confirm-url: ${TOSS_CONFIRM_URL:https://api.tosspayments.com/v1/payments/confirm}

services:
  mysql:
    image: mysql:8.0
    container_name: ikea-prod-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ikea_ordering
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - ikea-prod-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ikea-prod-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ikea_ordering?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY}

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend.prod
      args:
        VITE_API_BASE_URL: ""
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY}
        VITE_NAVER_MAP_KEY: ${VITE_NAVER_MAP_KEY}
    container_name: ikea-prod-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-8081}:80"

volumes:
  ikea-prod-mysql-data:

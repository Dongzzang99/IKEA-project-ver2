services:
  mysql:
    image: mysql:8.0
    container_name: ikea-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ikea_ordering
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports:
      - "3307:3306"
    volumes:
      - ikea-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ikea-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/ikea_ordering?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      JWT_SECRET: ${JWT_SECRET:-portfolio-ikea-ordering-system-jwt-secret-key-2026-local-docker-default}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:-test_gsk_replace_me}
    ports:
      - "8080:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8080}
        VITE_TOSS_CLIENT_KEY: ${VITE_TOSS_CLIENT_KEY:-}
        VITE_NAVER_MAP_KEY: ${VITE_NAVER_MAP_KEY:-}
    container_name: ikea-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  ikea-mysql-data:
